<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учебный план</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070d1f;
  --bg-mid: #0d1730;
  --surface: rgba(14, 22, 50, 0.85);
  --surface-2: rgba(22, 34, 72, 0.70);
  --surface-3: rgba(30, 48, 100, 0.50);
  --glass-border: rgba(255, 255, 255, 0.10);
  --ink: #e8f0fe;
  --ink-soft: #7b91cc;
  --ink-muted: #4a5f8a;
  --line: rgba(99, 130, 210, 0.18);

  --accent: #3b82f6;
  --accent-2: #7c3aed;
  --accent-gold: #f59e0b;
  --accent-glow: rgba(59, 130, 246, 0.35);
  --accent-soft: rgba(59, 130, 246, 0.12);

  --bad: #ef4444;
  --bad-weak: rgba(239, 68, 68, 0.12);
  --success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.12);

  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: 'Onest', var(--font-body);
  --font-mono: 'JetBrains Mono', monospace;

  --shadow: 0 4px 16px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.4);
  --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  padding: 0 0 90px;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse 80% 60% at 20% -10%, rgba(59,130,246,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 110%, rgba(124,58,237,0.14) 0%, transparent 55%);
  background-attachment: fixed;
}

h1, h2, h3 { margin: 0; }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 14px; }

header {
  padding: 14px 16px;
  margin: 12px 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
}

header .logo { font-size: 22px; }
header h1 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--ink) 0%, #93c5fd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
header .pill {
  margin-left: auto;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #fff;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 99px;
  white-space: nowrap;
  box-shadow: 0 0 10px var(--accent-glow);
}

/* Нижняя капсульная навигация */
.bottomnav {
  position: fixed;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  gap: 6px;
  align-items: center;
  width: calc(100% - 24px);
  max-width: 440px;
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 5px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}

.navbtn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 46px;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  border-radius: 22px;
  cursor: pointer;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  transition: all 0.25s ease;
}

.navbtn .ni { font-size: 18px; line-height: 1; }
.navbtn .nl { display: none; text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; }

.navbtn.active {
  flex: 1.6;
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 16px var(--accent-glow);
}
.navbtn.active .nl { display: inline; }

/* Карточки */
.card {
  background: var(--surface);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 16px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}

.card.hero {
  border-color: rgba(59, 130, 246, 0.3);
  box-shadow: 0 4px 24px rgba(59, 130, 246, 0.15);
}

.card h2 {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-soft);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.card h2 .sub {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-muted);
  white-space: nowrap;
  text-transform: none;
}

/* Hero Section */
.hero { text-align: center; padding: 20px 16px 24px; }
.hero .big {
  font-family: var(--font-display);
  font-size: 56px;
  font-weight: 800;
  line-height: 1;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-variant-numeric: tabular-nums;
}
.hero .big small { font-size: 28px; font-weight: 700; }
.hero .sub2 { font-size: 13px; color: var(--ink-soft); margin-top: 8px; font-weight: 500; }

/* Path progress */
.path { margin-top: 20px; }
.path-track {
  position: relative;
  height: 10px;
  background: var(--surface-3);
  border-radius: 99px;
}
.path-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent-gold) 100%);
  transition: width .5s cubic-bezier(0.16,1,0.3,1);
  box-shadow: 0 0 8px var(--accent-glow);
}
.path-knob {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 18px;
  transition: left .5s cubic-bezier(0.16,1,0.3,1);
}
.path-scale {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--ink-muted);
  font-family: var(--font-mono);
  margin-top: 8px;
  font-weight: 600;
}

/* Split accuracy bar */
.split {
  display: flex;
  height: 8px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--surface-3);
  margin: 6px 0 12px;
}
.split .ok { background: var(--success); transition: width .3s ease; }
.split .no { background: var(--bad); transition: width .3s ease; }

.splitrow { display: flex; gap: 10px; }
.splitrow .b {
  flex: 1;
  text-align: center;
  border-radius: 12px;
  padding: 10px 6px;
  border: 1px solid var(--line);
}
.splitrow .b.ok { background: var(--success-soft); border-color: rgba(16,185,129,0.3); }
.splitrow .b.no { background: var(--bad-weak); border-color: rgba(239,68,68,0.3); }
.splitrow .b .n {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 800;
}
.splitrow .b.ok .n { color: var(--success); }
.splitrow .b.no .n { color: var(--bad); }
.splitrow .b .l {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--ink-soft);
  margin-top: 2px;
}

/* Per item */
.item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; padding-bottom: 0; }
.item .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.item .ico { font-size: 16px; }
.item .name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .cnt { margin-left: auto; font-family: var(--font-mono); font-weight: 700; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.bartrack { height: 5px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.barfill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-gold) 100%); transition: width .5s ease; }
.item .acc { font-size: 11px; color: var(--ink-muted); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.item .acc b { color: var(--success); }
.item .acc .x { color: var(--bad); }

/* Planner rows */
.prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .ico { font-size: 18px; flex: none; }
.prow .grow { min-width: 0; flex: 1; }
.prow .pname { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pmeta { font-size: 11px; color: var(--ink-soft); }
.play {
  border: 0;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color: #fff;
  font-weight: 800;
  font-size: 14px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  flex: none;
  box-shadow: 0 0 10px var(--accent-glow);
  transition: transform 0.15s ease;
}
.play:hover { transform: scale(1.1); }

.chip {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 11px;
  margin-bottom: 8px;
}
.chip .ico { font-size: 16px; }
.chip .grow { min-width: 0; flex: 1; }
.chip .cname { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .cx { border: 0; background: transparent; color: var(--ink-muted); font-size: 16px; cursor: pointer; padding: 2px 4px; flex: none; }
.chip .cx:hover { color: var(--bad); }

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head button {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: border-color 0.15s ease;
}
.cal-head button:hover { border-color: var(--accent); color: var(--accent); }
.cal-title { font-weight: 700; font-size: 14px; text-transform: capitalize; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-grid .wd { text-align: center; font-size: 10px; color: var(--ink-muted); font-weight: 700; padding: 2px 0; font-family: var(--font-mono); }
.cal-grid .day {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  background: var(--surface-2);
  color: var(--ink);
  user-select: none;
  transition: all 0.15s ease;
}
.cal-grid .day.empty { background: transparent; cursor: default; }
.cal-grid .day.in { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.cal-grid .day.edge { background: var(--accent); color: #fff; font-weight: 800; box-shadow: 0 0 10px var(--accent-glow); }
.cal-grid .day.today { font-weight: 800; color: var(--accent); border: 1px solid var(--accent); }
.period-label {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-top: 12px;
  padding: 8px;
  background: var(--accent-soft);
  border-radius: 8px;
  border: 1px solid var(--accent);
}

/* Form */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin-bottom: 5px; }
.field input, .field select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--ink);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s ease;
}
.field input:focus, .field select:focus { border-color: var(--accent); }

.seg { display: flex; gap: 6px; background: var(--surface-2); padding: 3px; border-radius: 10px; border: 1px solid var(--line); }
.seg button {
  flex: 1;
  padding: 7px;
  border: 0;
  background: transparent;
  color: var(--ink-muted);
  border-radius: 7px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.seg button.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }

.row2 { display: flex; gap: 10px; align-items: flex-end; }
.row2 > * { flex: 1; }

.btn {
  width: 100%;
  border: 0;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  padding: 11px;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 4px;
  box-shadow: 0 0 12px var(--accent-glow);
  transition: all 0.15s ease;
}
.btn:hover { background: #2563eb; transform: translateY(-1px); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); box-shadow: none; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.sm { padding: 9px 14px; font-size: 13px; }

.empty { text-align: center; color: var(--ink-muted); font-size: 13px; padding: 22px 10px; }
.tip { font-size: 11px; color: var(--ink-muted); text-align: center; margin-top: 12px; line-height: 1.5; }
.hide { display: none !important; }

@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#view-dash, #view-plan { animation: viewIn 0.3s cubic-bezier(.16,1,.3,1) both; }
@media (prefers-reduced-motion: reduce) { #view-dash, #view-plan { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">🌿</span>
    <h1>Учебный план</h1>
    <span class="pill" id="pill">—</span>
  </header>

  <!-- DASHBOARD -->
  <div id="view-dash">
    <div id="dash-body"></div>
  </div>

  <!-- PLAN -->
  <div id="view-plan" class="hide">
    <div id="active-plan"></div>

    <div class="card">
      <h2>🗓 Новый план</h2>
      <div class="cal-head">
        <button onclick="calNav(-1)">‹</button>
        <span class="cal-title" id="cal-title"></span>
        <button onclick="calNav(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="period-label" id="period-label"></div>
    </div>

    <div class="card">
      <h2>➕ Добавить задание</h2>
      <div class="field">
        <div class="seg" id="kind-seg">
          <button data-k="quiz" class="active" onclick="setItemKind('quiz')">📚 Квиз</button>
          <button data-k="tf" onclick="setItemKind('tf')">📇 Колода</button>
          <button data-k="cert" onclick="setItemKind('cert')">🎓 Сертиф.</button>
        </div>
      </div>

      <div class="field">
        <label>Материал</label>
        <select id="i-material"></select>
      </div>
      <div class="row2">
        <div class="field" style="margin-bottom:0">
          <label>Интервал (раз за период)</label>
          <input id="i-target" type="number" min="1" max="99" value="1">
        </div>
        <button class="btn sm" style="flex:none;width:auto;padding:10px 16px" onclick="addItem()">＋</button>
      </div>
    </div>

    <div class="card" id="draft-card">
      <h2>📋 Задания плана <span class="sub" id="draft-count"></span></h2>
      <div id="draft-list"></div>
      <button class="btn" style="margin-top:12px" onclick="savePlan()">💾 Сохранить план</button>
      <p class="tip">Запускай задания кнопкой ▶ в разделе «Текущий план» — только так прохождение засчитается. Доводи до конца: остановка на середине не считается.</p>
    </div>
  </div>

  <!-- CERTIFICATES -->
  <div id="view-cert" class="hide" style="height:calc(100vh - 120px); border-radius:16px; overflow:hidden; border:1px solid var(--glass-border);">
    <iframe id="iframe-cert" style="width:100%; height:100%; border:0; background:var(--bg);" src="about:blank"></iframe>
  </div>

  <!-- BIO SOLVER -->
  <div id="view-bio" class="hide" style="height:calc(100vh - 120px); border-radius:16px; overflow:hidden; border:1px solid var(--glass-border);">
    <iframe id="iframe-bio" style="width:100%; height:100%; border:0; background:var(--bg);" src="about:blank"></iframe>
  </div>
</div>

<nav class="bottomnav">
  <button id="tab-dash" class="navbtn active" onclick="showTab('dash')"><span class="ni">📊</span><span class="nl">Прогресс</span></button>
  <button id="tab-plan" class="navbtn" onclick="showTab('plan')"><span class="ni">🗓</span><span class="nl">План</span></button>
  <button id="tab-cert" class="navbtn" onclick="showTab('cert')"><span class="ni">📜</span><span class="nl">Сертификаты</span></button>
  <button id="tab-bio" class="navbtn" onclick="showTab('bio')"><span class="ni">🧬</span><span class="nl">Bio Solver</span></button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
let BOT_USERNAME = "";
let MATERIALS = {decks:[], quizzes:[]};
let DASH = null, PLAN = null;
const draft = { start:null, end:null, items:[] };
let itemKind = "quiz";
let apKind = "quiz";
let calMonth = new Date(); calMonth.setDate(1);

if (tg){
  tg.ready(); tg.expand();
  document.documentElement.setAttribute("data-theme", tg.colorScheme || "light");
  tg.onEvent("themeChanged", ()=>document.documentElement.setAttribute("data-theme", tg.colorScheme));
}

function hdr(){ return {"Content-Type":"application/json","X-Init-Data": tg?.initData || ""}; }
async function api(path, opts={}){
  const r = await fetch(path, {headers:hdr(), ...opts});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
const pct = v => Math.round((v||0)*100);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtd = s => { const p=String(s||"").split("-"); return p.length===3? p[2]+"."+p[1]+"."+p[0] : s; };

function showTab(t){
  document.getElementById("view-dash").classList.toggle("hide", t!=="dash");
  document.getElementById("view-plan").classList.toggle("hide", t!=="plan");
  document.getElementById("view-cert").classList.toggle("hide", t!=="cert");
  document.getElementById("view-bio").classList.toggle("hide", t!=="bio");

  const btnDash = document.getElementById("tab-dash");
  if(btnDash) btnDash.classList.toggle("active", t==="dash");
  document.getElementById("tab-plan").classList.toggle("active", t==="plan");
  document.getElementById("tab-cert").classList.toggle("active", t==="cert");
  document.getElementById("tab-bio").classList.toggle("active", t==="bio");

  if (t === "cert") {
    const iframeCert = document.getElementById("iframe-cert");
    if (iframeCert && iframeCert.src === "about:blank") {
      iframeCert.src = "/cert";
    }
  } else if (t === "bio") {
    const iframeBio = document.getElementById("iframe-bio");
    if (iframeBio && iframeBio.src === "about:blank") {
      iframeBio.src = "/bio";
    }
  }
}


/* ---------- DASHBOARD ---------- */
function renderDash(){
  const d = DASH, root = document.getElementById("dash-body"), pill = document.getElementById("pill");
  if(!d || !d.plan){
    pill.textContent = "—";
    root.innerHTML = `<div class="card"><div class="empty">📭 Плана пока нет.<br>Создай его во вкладке «🗓 План».</div>
      <button class="btn" onclick="showTab('plan')">Создать план</button></div>`;
    return;
  }
  const o = d.overall, p = d.plan, P = pct(o.pct);
  pill.textContent = P + "%";
  const dl = p.days_left==null ? "" :
    (p.days_left>0 ? `осталось ${p.days_left} дн` : (p.days_left===0 ? "последний день" : "период завершён"));
  const accTxt = o.answered ? pct(o.accuracy)+"%" : "—";

  let html = `
  <div class="card hero">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)">Общий прогресс</div>
    <div class="big" style="margin-top:8px">${P}<small>%</small></div>
    <div class="sub2">пройдено ${o.done} из ${o.target}${dl?" · "+dl:""}</div>
    <div class="path">
      <div class="path-track"><div class="path-fill" style="width:${P}%"></div>
        <div class="path-knob" style="left:${P}%">${P>=100?"🏁":"🚶"}</div></div>
      <div class="path-scale"><span>${fmtd(p.start_day)}</span><span>цель ${o.target}</span><span>${fmtd(p.end_day)}</span></div>
    </div>
  </div>

  <div class="card">
    <h2>🎯 Ответы за период <span class="sub">точность ${accTxt}</span></h2>
    <div class="split">
      <div class="ok" style="width:${o.answered?pct(o.correct/o.answered):0}%"></div>
      <div class="no" style="width:${o.answered?pct(o.incorrect/o.answered):0}%"></div>
    </div>
    <div class="splitrow">
      <div class="b ok"><div class="n">${o.correct}</div><div class="l">✓ правильно</div></div>
      <div class="b no"><div class="n">${o.incorrect}</div><div class="l">✗ неправильно</div></div>
    </div>
  </div>`;

  if(d.items.length){
    html += `<div class="card"><h2>📚 По заданиям</h2>` + d.items.map(it=>{
      const ip = pct(it.pct);
      const acc = it.answered ? pct(it.accuracy)+"%" : "—";
      return `<div class="item">
        <div class="top"><span class="ico">${it.kind==="tf"?"📇":"📚"}</span>
          <span class="name">${esc(it.title)}</span>
          <span class="cnt">${Math.min(it.done,it.target)}/${it.target} · ${ip}%</span></div>
        <div class="bartrack"><div class="barfill" style="width:${ip}%"></div></div>
        <div class="acc">пройдено ${it.done}× · <b>✓ ${it.correct}</b> · <span class="x">✗ ${it.incorrect}</span> · точность ${acc}</div>
      </div>`;
    }).join("") + `</div>`;
  }
  root.innerHTML = html;
}

/* ---------- PLAN TAB: active plan ---------- */
function renderPlanTab(){
  const box = document.getElementById("active-plan");
  if(PLAN){
    box.innerHTML = `<div class="card">
      <h2>📌 Текущий план <span class="sub">${fmtd(PLAN.start_day)} — ${fmtd(PLAN.end_day)}</span></h2>
      ${PLAN.items.map(it=>`<div class="prow">
        <span class="ico">${it.kind==="tf"?"📇":(it.kind==="cert"?"🎓":"📚")}</span>
        <div class="grow"><div class="pname">${esc(it.title)}</div>
          <div class="pmeta">цель ${it.target}× · ${it.kind==="tf"?"тест «Верно/Неверно»":(it.kind==="cert"?"сертификат":"квиз")}</div></div>
        <button class="play" onclick="launchItem(${it.id}, '${it.kind}', ${it.ref_id})" title="Пройти с регистрацией">▶</button>
      </div>`).join("")}
      <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:14px">
        <h2 style="margin-bottom:12px">➕ Добавить задание в этот план</h2>
        <div class="field">
          <div class="seg" id="ap-kind-seg">
            <button data-k="quiz" class="active" onclick="setApKind('quiz')">📚 Квиз</button>
            <button data-k="tf" onclick="setApKind('tf')">📇 Колода</button>
            <button data-k="cert" onclick="setApKind('cert')">🎓 Сертиф.</button>
          </div>
        </div>

        <div class="field"><label>Материал</label><select id="ap-material"></select></div>
        <div class="row2">
          <div class="field" style="margin-bottom:0">
            <label>Интервал (раз за период)</label>
            <input id="ap-target" type="number" min="1" max="99" value="1">
          </div>
          <button class="btn sm" style="flex:none;width:auto;padding:10px 16px" onclick="addToPlan()">＋</button>
        </div>
      </div>
      <button class="btn ghost" style="margin-top:14px" onclick="delPlan(${PLAN.id})">🗑 Удалить план</button>
    </div>
    <p class="tip">Добавляй задания сюда, не теряя прогресс. Создание нового плана ниже заменит текущий целиком.</p>`;
  } else {
    box.innerHTML = "";
  }
  if(PLAN) setApKind(apKind);
  renderCal();
  setItemKind(itemKind);
  renderDraft();
}

/* ---------- calendar ---------- */
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
function renderCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  document.getElementById("cal-title").textContent =
    calMonth.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  const lead=(new Date(y,m,1).getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  const todayY=ymd(new Date());
  let cells = WD.map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<lead;i++) cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=ymd(new Date(y,m,d));
    let cls="day";
    if(draft.start&&draft.end){
      if(ds>=draft.start&&ds<=draft.end) cls+=(ds===draft.start||ds===draft.end)?" edge":" in";
    } else if(draft.start&&ds===draft.start){ cls+=" edge"; }
    if(ds===todayY) cls+=" today";
    cells+=`<div class="${cls}" onclick="pickDay('${ds}')">${d}</div>`;
  }
  document.getElementById("cal-grid").innerHTML=cells;
  const lbl=document.getElementById("period-label");
  if(draft.start&&draft.end) lbl.textContent="✅ Период: "+fmtd(draft.start)+" — "+fmtd(draft.end);
  else if(draft.start) lbl.textContent="Начало "+fmtd(draft.start)+" · выбери конец периода";
  else lbl.textContent="Нажми на дату — начало периода";
}
function pickDay(ds){
  if(!draft.start || (draft.start&&draft.end)){ draft.start=ds; draft.end=null; }
  else { if(ds<draft.start) draft.start=ds; else draft.end=ds; }
  tg?.HapticFeedback?.selectionChanged?.();
  renderCal();
}
function calNav(delta){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+delta,1); renderCal(); }

/* ---------- item builder ---------- */
function fillMaterialSelect(selId, k){
  const sel=document.getElementById(selId);
  if(!sel) return;
  const items = k==="quiz"?MATERIALS.quizzes:(k==="tf"?MATERIALS.decks:(MATERIALS.certs||[]));
  sel.innerHTML = items.length
    ? items.map(m=>`<option value="${m.id}">${esc(m.title)} (${m.count})</option>`).join("")
    : `<option value="">— нет материалов —</option>`;
}
function setItemKind(k){
  itemKind=k;
  document.querySelectorAll("#kind-seg button").forEach(b=>b.classList.toggle("active", b.dataset.k===k));
  fillMaterialSelect("i-material", k);
}
/* add task into the EXISTING active plan (no replace) */
function setApKind(k){
  apKind=k;
  document.querySelectorAll("#ap-kind-seg button").forEach(b=>b.classList.toggle("active", b.dataset.k===k));
  fillMaterialSelect("ap-material", k);
}
async function addToPlan(){
  const sel=document.getElementById("ap-material");
  if(!sel || !sel.value){ alert("Нет материалов этого типа. Создай их в боте."); return; }
  const ref=+sel.value;
  const title=sel.options[sel.selectedIndex].textContent.replace(/\s*\(\d+\)\s*$/,"");
  const target=Math.max(1, +document.getElementById("ap-target").value||1);
  if(PLAN && PLAN.items.some(it=>it.kind===apKind && it.ref_id===ref)){ alert("Это задание уже в плане."); return; }
  try{
    await api("/api/plan/items",{method:"POST",body:JSON.stringify(
      {items:[{kind:apKind, ref_id:ref, title, target}]})});
    tg?.HapticFeedback?.notificationOccurred?.("success");
    await reloadAll();
  }catch(e){ alert("Не удалось добавить задание."); }
}
function addItem(){
  const sel=document.getElementById("i-material");
  if(!sel.value){ alert("Нет материалов этого типа. Создай их в боте."); return; }
  const ref=+sel.value;
  const title=sel.options[sel.selectedIndex].textContent.replace(/\s*\(\d+\)\s*$/,"");
  const target=Math.max(1, +document.getElementById("i-target").value||1);
  if(draft.items.some(it=>it.kind===itemKind && it.ref_id===ref)){ alert("Это задание уже добавлено."); return; }
  draft.items.push({kind:itemKind, ref_id:ref, title, target});
  tg?.HapticFeedback?.impactOccurred?.("light");
  renderDraft();
}
function removeItem(i){ draft.items.splice(i,1); renderDraft(); }
function renderDraft(){
  const list=document.getElementById("draft-list");
  document.getElementById("draft-count").textContent = draft.items.length? draft.items.length+" шт" : "";
  if(!draft.items.length){ list.innerHTML=`<div class="empty">Пока пусто. Добавь задания выше ☝️</div>`; return; }
  list.innerHTML = draft.items.map((it,i)=>`<div class="chip">
    <span class="ico">${it.kind==="tf"?"📇":(it.kind==="cert"?"🎓":"📚")}</span>
    <div class="grow"><div class="cname">${esc(it.title)}</div>
      <div class="pmeta">${it.kind==="tf"?"тест «Верно/Неверно»":(it.kind==="cert"?"сертификат":"квиз")} · интервал ${it.target}×</div></div>
    <button class="cx" onclick="removeItem(${i})">✕</button>
  </div>`).join("");
}

async function savePlan(){
  if(!draft.start||!draft.end){ alert("Выбери период — начало и конец."); return; }
  if(!draft.items.length){ alert("Добавь хотя бы одно задание."); return; }
  try{
    await api("/api/plan",{method:"POST",body:JSON.stringify(
      {start_day:draft.start, end_day:draft.end, items:draft.items})});
    tg?.HapticFeedback?.notificationOccurred?.("success");
    draft.start=draft.end=null; draft.items=[];
    await reloadAll(); showTab("dash");
  }catch(e){ alert("Не удалось сохранить план."); }
}

function launchItem(itemId, kind, refId){
  if(kind === "cert"){
    showTab("cert");
    const iframeCert = document.getElementById("iframe-cert");
    if(iframeCert){
      iframeCert.src = "/cert?take=" + refId;
    }
  } else {
    const url="https://t.me/"+BOT_USERNAME+"?start=pi_"+itemId;
    if(tg){ tg.openTelegramLink(url); tg.close(); } else location.href=url;
  }
}
function launch(itemId){ launchItem(itemId, 'quiz', 0); }
function delPlan(id){

  const go = async ()=>{ try{ await api("/api/plan/delete",{method:"POST",body:JSON.stringify({id})}); await reloadAll(); }catch(e){} };
  if(tg) tg.showConfirm("Удалить текущий план? Прогресс по нему пропадёт.", ok=>{ if(ok) go(); });
  else if(confirm("Удалить план?")) go();
}

/* ---------- loaders ---------- */
async function reloadAll(){
  try{ DASH = await api("/api/dashboard"); BOT_USERNAME = DASH.bot_username || BOT_USERNAME; }
  catch(e){ DASH=null; }
  try{ const pr = await api("/api/plan"); PLAN = pr.plan; BOT_USERNAME = pr.bot_username || BOT_USERNAME; }
  catch(e){ PLAN=null; }
  renderDash(); renderPlanTab();
}

(async function init(){
  try{ MATERIALS = await api("/api/materials"); }catch(e){}
  await reloadAll();
})();
</script>
